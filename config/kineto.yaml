# Satellite1 firmware talking to the Kineto backend instead of Home Assistant.
# Modeled on satellite1.yaml + satellite1.base.yaml, but with NO api/home_assistant
# and NO voice_assistant — voice sessions are handled by the kineto_voice component
# over a WebSocket connection to the Kineto backend.

substitutions:
  # Change to any preferred name
  friendly_name: "Satellite1 Kineto"

  # Recommend leaving the following unchanged
  node_name: satellite1-kineto
  company_name: FutureProofHomes
  project_name: Satellite1
  component_name: Core

  # set this version by GHA at build time
  esp32_fw_version: dev
  xmos_fw_version: "v1.0.3"

  # Kineto backend endpoint + device credentials.
  # Production gateway. For a dev install override per install — e.g. the local
  # voice-gateway on the dev machine (ws://<LAN-IP>:8085/ws/device, port-proxied into WSL)
  # or the dev cloud (wss://speaker.hague.dev/ws/device).
  kineto_ws_url: wss://speaker.kineto.app/ws/device
  kineto_device_id: satellite1-dev
  kineto_auth_token: dev-token

globals:
  # Global initialisation variable. Initialized to true and set to false once everything is connected.
  - id: init_in_progress
    type: bool
    restore_value: no
    initial_value: 'true'
  # Global variable storing if user action causes warning
  - id: warning
    type: bool
    restore_value: no
    initial_value: 'false'
  # Global variable tracking the XMOS flasher status.
  - id: xmos_flashing_state
    type: int
    restore_value: no
    initial_value: '0'
  # Global variable tracking the negotiated USB-PD power contract.
  - id: pd_power_contract
    type: int
    restore_value: no
    initial_value: '0'

esphome:
  name: ${node_name}
  name_add_mac_suffix: true
  friendly_name: ${friendly_name}
  min_version: 2026.4.0

  project:
    name: ${company_name}.${project_name}
    version: ${esp32_fw_version}

  on_boot:
    - priority: -100
      then:
        - logger.log: "${company_name} ${project_name} ${component_name} (Kineto) running ESP firmware: ${esp32_fw_version} and XMOS firmware: ${xmos_fw_version}"
        # Run the script to refresh the LED status
        - script.execute: control_leds
        - delay: 1s

        # if line_out was used previously but is not available try speaker
        - lambda: |
            if( !id(line_out_sensor).state && id(dac_proxy).active_dac == 1){
              id(dac_proxy).activate_speaker();
            }

        # If after 10 minutes the device is still initializing (did not connect to the
        # Kineto backend), turn off the init_in_progress variable and refresh the LEDs
        - delay: 10min
        - if:
            condition:
              lambda: return id(init_in_progress);
            then:
              - lambda: id(init_in_progress) = false;
              - script.execute: control_leds

packages:
  core_board: !include common/core_board.yaml
  wifi: !include common/wifi_improv.yaml
  buttons: !include common/buttons_no_ha.yaml
  spk: !include common/speaker_no_ha.yaml
  mp: !include common/media_player_no_ha.yaml
  timer: !include common/timer_no_ha.yaml
  led_ring: !include common/led_ring_no_ha.yaml
  kineto: !include common/kineto_voice.yaml

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # ESPHome's ESP32 default is "light" — the modem dozes between DTIM beacons,
  # and frames lost while dozing hit ~1s TCP retransmission timeouts. On a
  # mains-powered speaker streaming audio that showed up as periodic 1-1.5s
  # playback stalls (and added latency to the voice WSS).
  power_save_mode: none
  # The mesh here (one SSID, four BSSIDs) periodically steers this client off an AP ('Auth Leave',
  # measured 2026-08-21), and the default full scan afterwards costs ~8-10 s of the ~20 s gap.
  # fast_connect reconnects to the stored AP without scanning; if that AP refuses, the stack falls
  # back to a scan on the second attempt, so a genuinely-moved network still connects.
  fast_connect: true
  on_disconnect:
    - ble.enable:
  on_connect:
    # The other half of the gap: the websocket client's retry timer is up to 5 s away, and the
    # network coming back is exactly what it is waiting for.
    - lambda: id(kv).network_recovered();
    - delay: 5s  # Gives time for improv results to be transmitted
    - ble.disable:

esp32_improv:
  authorizer: btn_action
  on_start:
    - lambda: id(improv_ble_in_progress) = true;
    - script.execute: control_leds
  on_provisioned:
    - lambda: id(improv_ble_in_progress) = false;
    - script.execute: control_leds
  on_stop:
    - lambda: id(improv_ble_in_progress) = false;
    - script.execute: control_leds

ota:
  - platform: esphome
    id: ota_esphome
  - platform: http_request
    id: ota_http_request

http_request:

safe_mode:

status_led:
  pin:
    number: GPIO45
    ignore_strapping_warning: true

fusb302b:
  id: pd_fusb302b
  irq_pin: GPIO1
  request_voltage: 20
  on_power_ready:
    then:
      - logger.log:
          format: "PD contract got accepted: %s"
          args: ['id(pd_fusb302b).contract.c_str()']
      - text_sensor.template.publish:
          id: pd_state_text
          state: !lambda 'return id(pd_fusb302b).contract;'
      - lambda: id(pd_power_contract) = id(pd_fusb302b).contract_voltage;
      - script.execute: tas2780_ensure_active

satellite1:
  id: satellite1_id
  spi_id: spi_0
  cs_pin: GPIO10
  data_rate: 8000000
  spi_mode: MODE3
  xmos_rst_pin: GPIO4

  on_xmos_no_response:
    then:
      - text_sensor.template.publish:
          id: xmos_firmware_version_text
          state: !lambda 'return id(satellite1_id).status_string();'
      - if:
          condition:
            - lambda: return id(init_in_progress);
            - lambda: return id(xflash).has_image_embedded();
          then:
            - memory_flasher.write_embedded_image:

  on_xmos_connected:
    then:
      - text_sensor.template.publish:
          id: xmos_firmware_version_text
          state: !lambda 'return id(satellite1_id).status_string();'
      - delay: 1s
      - script.execute: control_leds
      - if:
          condition:
            - lambda: return id(init_in_progress);
            - lambda: return id(xflash).has_image_embedded();
            - lambda: return !id(xflash).match_embedded( id(satellite1_id).xmos_fw_version );
          then:
            - memory_flasher.write_embedded_image:
      # TEMP (standalone wake-word bring-up test): start mww without waiting for
      # the gateway connection. Revert to on_connected-only after (2). See kineto_voice.yaml:112.
      - micro_wake_word.start:

memory_flasher:
  - platform: satellite1
    id: xflash
    embed_flash_image:
      image_version: ${xmos_fw_version}
      image_file: https://raw.githubusercontent.com/FutureProofHomes/Documentation/refs/heads/main/assets/firmware/xmos/${xmos_fw_version}/satellite1_firmware_fixed_delay.factory.bin
      md5_file: https://raw.githubusercontent.com/FutureProofHomes/Documentation/refs/heads/main/assets/firmware/xmos/${xmos_fw_version}/satellite1_firmware_fixed_delay.factory.md5

    on_flashing_start:
      then:
        - lambda: id(xmos_flashing_state) = 1;
        - script.execute: control_leds

    on_progress_update:
      then:
        - lambda: id(global_led_animation_index) = id(xflash).flashing_progress * 24 / 100;
        - script.execute: control_leds

    on_flashing_success:
      then:
        - lambda: id(xmos_flashing_state) = 2;
        - script.execute: control_leds
        - lambda: id(xmos_flashing_state) = 0;
        - if:
            condition:
              lambda: |-
                return id(pd_fusb302b).contract_voltage >= 9;
            then:
              - tas2780.activate:
                  mode: 2
            else:
              - tas2780.activate:
                  mode: 0

    on_flashing_failed:
      then:
        - lambda: id(xmos_flashing_state) = 3;
        - script.execute: control_leds
        - lambda: id(xmos_flashing_state) = 0;

    on_erasing_done:
      then:
        - if:
            condition:
              lambda: return id(factory_reset_requested);
            then:
              - button.press: factory_reset_button

# Local device entities that home_assistant.yaml used to provide (minus the api: block).
button:
  # Restarts Sat1 Device
  - platform: restart
    name: "Restart Sat1"
    entity_category: diagnostic

  # Restores the Sat1 ESP back to factory settings
  - platform: factory_reset
    id: factory_reset_button
    name: "Factory Reset ESP32 FW"
    entity_category: diagnostic
    internal: true

switch:
  # Wake Word Sound Switch.
  - platform: template
    id: wake_sound
    name: Wake sound
    icon: "mdi:bullhorn"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

    # This is the master mute switch. The user can only turn it on and off if the
    # hardware switch is off. (The hardware switch overrides the software one)
  - platform: template
    id: master_mute_switch
    restore_mode: RESTORE_DEFAULT_OFF
    icon: "mdi:microphone-off"
    name: Mute Microphones
    entity_category: config
    turn_on_action:
      - if:
          condition:
            binary_sensor.is_off: btn_left
          then:
            - switch.template.publish:
                id: master_mute_switch
                state: ON
    turn_off_action:
      - if:
          condition:
            binary_sensor.is_off: btn_left
          then:
            - switch.template.publish:
                id: master_mute_switch
                state: OFF
          else:
            - lambda: id(warning) = true;
            - script.execute: control_leds
    on_turn_on:
      - script.execute: control_leds
    on_turn_off:
      - script.execute: control_leds

text_sensor:
  - platform: template
    id: pd_state_text
    name: "USB-C Power Supply"
    icon: "mdi:usb-c-port"
    entity_category: "diagnostic"
    update_interval: never
    lambda: |-
      if( id(pd_fusb302b).state == power_delivery::PD_STATE_DISCONNECTED){
        return std::string("Detached");
      } else {
        return id(pd_fusb302b).contract;
      }

  - platform: template
    id: xmos_firmware_version_text
    name: "XMOS Firmware"
    icon: "mdi:memory"
    entity_category: "diagnostic"
    update_interval: never
    lambda: return id(satellite1_id).status_string();

external_components:
  - source:
      type: local
      path: ../esphome/components
    components:
      - fusb302b
      - i2s_audio
      - kineto_voice
      - memory_flasher
      - pcm5122
      - satellite1
      - satellite1_radar
      - tas2780

  - source:
      # https://github.com/esphome/esphome/pull/12429
      type: git
      url: https://github.com/esphome/esphome
      ref: ff8ce89556748509d7ee8724e12d9d43d3c8c1e8
    refresh: 300s
    components: [http_request]

logger:
  deassert_rts_dtr: true
  hardware_uart: USB_SERIAL_JTAG
  level: DEBUG
  logs:
    ltr_als_ps: WARN
    i2c.idf: WARN
    # The websocket to the gateway drops occasionally and neither side records why: the client
    # that knows the reason is an ESP-IDF component, and its output is compiled out below DEBUG.
    # These tags make it say what happened — a reset, a timeout, a read error and its errno.
    websocket_client: DEBUG
    transport_ws: DEBUG
    transport: DEBUG
    transport_base: DEBUG
    esp-tls: DEBUG
    wifi: INFO
    esp-idf: INFO
    micro_wake_word: DEBUG
    satellite1: INFO
