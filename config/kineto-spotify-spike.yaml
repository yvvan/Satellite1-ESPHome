# Spotify-on-device spike: the full Kineto firmware plus the cspot_player component.
# Milestone under test: cspot builds, pairs (zeroconf), streams, and coexists with the
# wake word + voice WSS stack in memory. PCM is discarded (no audio output yet).

substitutions:
  node_name: satellite1-spotify-spike
  friendly_name: "Satellite1 Spotify Spike"

packages:
  kineto: !include kineto.yaml

# The cspot fork is migrated to an exceptions-free build (throw -> log+abort),
# so the whole firmware keeps the stock -fno-exceptions flags.

# Internal DRAM is the scarce resource (steady state was ~25KB free with ESPHome's
# auto "high-performance" networking: 512 dynamic WiFi RX buffers and 512KB TCP
# windows). Neither voice (256kbps) nor Spotify (320kbps vorbis) needs anywhere near
# that; trim to sane values and let WiFi/lwIP allocate from PSRAM where possible.
esp32:
  framework:
    sdkconfig_options:
      CONFIG_ESP_WIFI_DYNAMIC_RX_BUFFER_NUM: "64"
      CONFIG_ESP_WIFI_DYNAMIC_TX_BUFFER_NUM: "32"
      CONFIG_ESP_WIFI_RX_BA_WIN: "16"
      CONFIG_LWIP_TCP_WND_DEFAULT: "32768"
      CONFIG_LWIP_TCP_SND_BUF_DEFAULT: "32768"
      CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP: "y"
      # The stock firmware uses SPIRAM_USE_CAPS_ALLOC, so plain malloc()/operator new
      # only ever draws from internal DRAM (~25KB free steady-state) — cspot's mid-size
      # allocations (make_shared<PlaybackState>, protobuf buffers) abort. Route the
      # caps-unaware heap (malloc/new) through PSRAM instead: allocations above the
      # ALWAYSINTERNAL threshold land in the 8MB PSRAM, small/DMA ones stay internal.
      CONFIG_SPIRAM_USE_CAPS_ALLOC: "n"
      CONFIG_SPIRAM_USE_MALLOC: "y"
      # 512, not 2048: every allocation between the two sizes now lands in PSRAM instead of
      # carving up internal DRAM. What matters internally is not how much is free but whether a
      # CONTIGUOUS block is — the reply resampler asks for one DMA-capable chunk, and on
      # 2026-08-21 it failed with 34 KB free and a largest block of 23.5 KB, while the day before
      # it succeeded with 26 KB free. Fragmentation, not exhaustion.
      CONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL: "512"
      # Doubled: this is the internal floor plain malloc may not touch, which is what leaves room
      # for the DMA-capable requests the audio path makes when a reply starts.
      CONFIG_SPIRAM_MALLOC_RESERVE_INTERNAL: "65536"
      # MBEDTLS_DYNAMIC_BUFFER is deliberately ABSENT (removed 2026-08-20 after three field
      # crashes): the dynamic port frees the rx record buffer between records while
      # ssl_check_ctr_renegotiate on the WRITE path still reads a counter inside it, so any
      # second task writing to the same TLS session (the wss audio stream) hits freed memory —
      # LoadProhibited, full reboot. Its RAM saving is already covered by SPIRAM_USE_MALLOC
      # above: record buffers are >2KB, so they land in PSRAM either way.
      # Without this the ESP-IDF logs above DEBUG are stripped at compile time, so the network
      # client's own account of a dropped socket never reaches the log at all.
      CONFIG_LOG_MAXIMUM_LEVEL_DEBUG: "y"
      # Speak the mesh's roaming language (802.11k neighbor reports + 802.11v BSS transition).
      # A mesh steers clients it can talk to with a polite transition request, and deauthenticates
      # the ones it cannot — which is what every 'Auth Leave' drop in this room was. The flags on
      # the station config (rm/btm) are set by kineto_voice; this compiles the supplicant half in.
      CONFIG_ESP_WIFI_11KV_SUPPORT: "y"

# Dev only: the device has no screen and its USB port resets it on connect, so this is the only
# way to read its own account of a dropped link. Nothing connects to it but `esphome logs`.
# reboot_timeout MUST stay 0: the default is 15 min, meaning the device reboots whenever no API
# client has been connected for that long — which would manufacture the very dropouts under
# investigation.
api:
  reboot_timeout: 0s

external_components:
  - source:
      type: local
      path: ../esphome/components
    components: [cspot_player]

# bell's MDNSService (used for the _spotify-connect zeroconf advert) only adds a
# service record — the IDF mdns stack must already be initialized, which ESPHome's
# mdns component does. kineto.yaml doesn't enable it (no HA), so enable it here.
mdns:

cspot_player:
  id: cspot_music
  name: "Kinetik Speaker"
  # Local checkout of the cspot fork (kineto branch); iterated on directly during the spike.
  cspot_component_path: /mnt/d/code/cspot/idf/cspot
  # Feed decoded PCM into the media pipeline (resampler -> mixer -> I2S -> DAC),
  # the same path the stock media_player uses.
  media_speaker: media_resampling_speaker

# Route the gateway's level-2 media shortcuts (pause/resume/next) into cspot's
# SpircHandler, so the Spotify Connect state stays in sync across devices.
# Merges into the kineto_voice block that kineto.yaml brings in.
kineto_voice:
  # Spike: start UNPAIRED so the device runs the pairing flow (say the password to it).
  # The paired identity then lives in NVS; clear the NVS `kineto` namespace to unpair again.
  auth_token: ""
  on_media_pause:
    - lambda: id(cspot_music).set_paused(true);
  on_media_resume:
    # A resume with no Spotify session is reported, not swallowed: the gateway's resume-nack
    # window turns the report into an agent turn carrying the user's own words.
    - lambda: |-
        if (id(cspot_music).has_session()) {
          id(cspot_music).set_paused(false);
        } else {
          id(kv).send_command_failed("resume", "nothing_to_resume");
        }
  on_media_next:
    - lambda: id(cspot_music).next_track();
  # A media `play` frame goes to the component that owns the media speaker, so our own audio and
  # Spotify can never write into it at once. It decodes the file itself; the media_player pipeline
  # plays FLAC but produces nothing from an MP3.
  on_media_play:
    - lambda: id(cspot_music).play_url(url, token);
