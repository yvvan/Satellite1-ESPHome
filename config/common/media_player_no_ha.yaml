# Copy of common/media_player.yaml for the Kineto (no Home Assistant, no voice_assistant) build.
# Keep in sync with common/media_player.yaml apart from the documented differences.
#
# Documented difference: the media pipeline declares no format (see below), because Kineto plays
# audio the agent produced and that arrives in whatever the generator wrote — usually MP3.

substitutions:
  jack_connected_sound_file: https://fph-firmware-assets.s3.us-east-1.amazonaws.com/sounds/jack_connected.flac
  jack_disconnected_sound_file: https://fph-firmware-assets.s3.us-east-1.amazonaws.com/sounds/jack_disconnected.flac
  mute_switch_on_sound_file: https://fph-firmware-assets.s3.us-east-1.amazonaws.com/sounds/mute_switch_on.flac
  mute_switch_off_sound_file: https://fph-firmware-assets.s3.us-east-1.amazonaws.com/sounds/mute_switch_off.flac
  timer_finished_sound_file: https://fph-firmware-assets.s3.us-east-1.amazonaws.com/sounds/timer_finished.flac
  wake_word_triggered_sound_file: https://fph-firmware-assets.s3.us-east-1.amazonaws.com/sounds/wake_word_triggered.flac
  factory_reset_initiated_sound_file: https://fph-firmware-assets.s3.us-east-1.amazonaws.com/sounds/factory_reset_initiated.mp3
  factory_reset_cancelled_sound_file: https://fph-firmware-assets.s3.us-east-1.amazonaws.com/sounds/factory_reset_cancelled.mp3
  factory_reset_confirmed_sound_file: https://fph-firmware-assets.s3.us-east-1.amazonaws.com/sounds/factory_reset_confirmed.mp3
  center_button_press_sound_file: https://fph-firmware-assets.s3.us-east-1.amazonaws.com/sounds/center_button_press.flac
  center_button_double_press_sound_file: https://fph-firmware-assets.s3.us-east-1.amazonaws.com/sounds/center_button_double_press.flac
  center_button_triple_press_sound_file: https://fph-firmware-assets.s3.us-east-1.amazonaws.com/sounds/center_button_triple_press.flac
  center_button_long_press_sound_file: https://fph-firmware-assets.s3.us-east-1.amazonaws.com/sounds/center_button_long_press.flac

audio_file:
  - id: factory_reset_initiated_sound
    file: ${factory_reset_initiated_sound_file}
  - id: factory_reset_cancelled_sound
    file: ${factory_reset_cancelled_sound_file}
  - id: factory_reset_confirmed_sound
    file: ${factory_reset_confirmed_sound_file}
  - id: jack_connected_sound
    file: ${jack_connected_sound_file}
  - id: jack_disconnected_sound
    file: ${jack_disconnected_sound_file}
  - id: mute_switch_on_sound
    file: ${mute_switch_on_sound_file}
  - id: mute_switch_off_sound
    file: ${mute_switch_off_sound_file}
  - id: timer_finished_sound
    file: ${timer_finished_sound_file}
  - id: wake_word_triggered_sound
    file: ${wake_word_triggered_sound_file}
  # Spoken locally when a turn cannot reach the gateway — the only moment the device has something
  # to say without the gateway's TTS, so it ships in flash. English on purpose: this is a built-in
  # device phrase, identical for every owner, not the language of whoever happens to be talking to
  # it. FLAC 16 kHz / mono / 16-bit, the only shape the announcement decoder plays.
  - id: kineto_unreachable_sound
    file: ../sounds/kineto_unreachable.flac
  - id: center_button_press_sound
    file: ${center_button_press_sound_file}
  - id: center_button_double_press_sound
    file: ${center_button_double_press_sound_file}
  - id: center_button_triple_press_sound
    file: ${center_button_triple_press_sound_file}
  - id: center_button_long_press_sound
    file: ${center_button_long_press_sound_file}

media_source:
  - platform: audio_file
    id: audio_file_announcement_source
  - platform: http_request
    id: http_announcement_source
    buffer_size: 250000
  - platform: http_request
    id: http_media_source
    buffer_size: 500000

media_player:
  - platform: speaker_source
    id: external_media_player
    name: Media Player
    volume_increment: 0.05
    volume_min: 0.1
    volume_max: 1.0
    announcement_pipeline:
      speaker: announcement_resampling_speaker
      format: FLAC     # FLAC is the least processor intensive codec
      num_channels: 1  # Stereo audio is unnecessary for announcements
      sample_rate: 48000
      sources:
        - audio_file_announcement_source
        - http_announcement_source
    media_pipeline:
      speaker: media_resampling_speaker
      # No format on purpose. `format:` does not describe what the pipeline accepts at runtime —
      # it decides which decoders are COMPILED IN (esphome/components/speaker_source
      # /media_player.py: request_flac_support / request_mp3_support / request_opus_support). Naming
      # FLAC here left the binary with a FLAC decoder alone, so a link to any other kind of audio
      # could not be played at all. NONE means "accepts any format", which pulls all three in.
      # The announcement pipeline keeps FLAC: everything it plays is a flash-resident chime.
      format: NONE
      num_channels: 2
      sample_rate: 48000
      sources:
        - http_media_source

    on_mute:
      - script.execute: control_leds
    on_unmute:
      - script.execute: control_leds
    on_volume:
      - script.execute: control_leds
    # Apply audio ducking when an announcement starts
    on_announcement:
      # Force the internal speaker DAC + amplifier on so voice replies are audible.
      # Without this the announcement streams into i2s but the TAS2780 may be asleep
      # or the proxy routed to line-out -> silent replies.
      - logger.log: "voice announcement: activating internal speaker + amp"
      - dac_proxy.activate_speaker:
      - script.execute: tas2780_ensure_active
      - mixer_speaker.apply_ducking:
          id: media_mixing_input
          decibel_reduction: 20
          duration: 0.0s

    # Restore audio ducking when not actively playing announcements or running voice assistant
    on_state:
      - if:
          condition:
            and:
              - switch.is_off: timer_ringing
              - lambda: return !id(kv).is_listening();
              - not:
                  media_player.is_announcing: external_media_player
          then:
            - mixer_speaker.apply_ducking:
                id: media_mixing_input
                decibel_reduction: 0
                duration: 1.0s

script:
  # Script executed when we want to play sounds on the device.
  - id: play_sound
    parameters:
      priority: bool
      sound_file: string
    then:
      - if:
          condition:
            lambda: return priority;
          then:
            - media_player.stop:
                id: external_media_player
                announcement: true
      - lambda: |-
          if ( (id(external_media_player).state != media_player::MediaPlayerState::MEDIA_PLAYER_STATE_ANNOUNCING ) || priority) {
            id(external_media_player)
              ->make_call()
              .set_media_url("audio-file://" + sound_file)
              .set_announcement(true)
              .perform();
          }

  # Script to increased/decreased volume
  - id: control_volume
    mode: restart
    parameters:
      increase_volume: bool  # True: Increase volume / False: Decrease volume.
    then:
      - delay: 16ms
      - if:
          condition:
            lambda: return increase_volume;
          then:
            - media_player.volume_up:
                id: external_media_player
          else:
            - media_player.volume_down:
                id: external_media_player
      - script.execute: control_leds
      - delay: 2s
      - lambda: id(volume_buttons_touched) = false;
      - script.execute: control_leds
