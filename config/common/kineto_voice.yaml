substitutions:
  # Phases of the Kineto voice satellite.
  # Mirrors common/voice_assistant.yaml so the (no-HA) LED ring scripts keep working unchanged.
  # The voice satellite is ready to be triggered by a wake word
  voice_assist_idle_phase_id: '1'
  # The voice satellite is streaming audio to the Kineto backend
  voice_assist_waiting_for_command_phase_id: '2'
  # The voice satellite is listening for a voice command
  voice_assist_listening_for_command_phase_id: '3'
  # The voice satellite is waiting for the backend to process the command
  voice_assist_thinking_phase_id: '4'
  # The voice satellite is replying to the command
  voice_assist_replying_phase_id: '5'
  # The voice satellite is not ready (no backend connection)
  voice_assist_not_ready_phase_id: '10'
  # The voice satellite encountered an error
  voice_assist_error_phase_id: '11'

  # Kineto backend endpoint. Override these in the top-level config / at install time.
  kineto_ws_url: wss://kineto.invalid/api/voice/ws
  kineto_device_id: satellite1-dev
  kineto_auth_token: dev-token

globals:
  # Global variable tracking the phase of the voice satellite (kept name-compatible with
  # the voice_assistant package so the LED scripts can be reused).
  - id: voice_assistant_phase
    type: int
    restore_value: no
    initial_value: ${voice_assist_not_ready_phase_id}

microphone:
  - platform: satellite1
    id: sat1_mics
    sample_rate: 48000
    i2s_din_pin: GPIO15
    bits_per_sample: 32bit
    channel: stereo
    pdm: false
    adc_type: external
    i2s_audio_id: i2s_shared

micro_wake_word:
  id: mww
  models:
    # Our own model, trained on 50k synthesized samples augmented with room impulses, ambient
    # noise and music (microWakeWord, 40k steps). Calibration picked cutoff 0.82 / window 3:
    # 99.36% recall at 0.93 false accepts per hour. It is the only phrase this speaker answers
    # to: `hey_jarvis` and `okay_nabu` rode along for comparison until it won, and left the
    # loosest threshold in the build (okay_nabu at 0.85) armed against a room playing music.
    - model: ../wake-words/hey_kinetic.json
      id: hey_kinetic
      # Just below the manifest's calibrated 0.80, which is the opposite of what the previous model
      # needed (it was raised to 0.95 to smother false accepts on "hey jarvis" and Russian
      # "рулетик"). Training with those phrases as hard negatives made the model pickier in both
      # directions: it now rejects them on its own — 3%, 2% and 0% of samples respectively — but
      # genuine wakes in this room dropped from 0.95-0.98 to 0.82-0.87, so 0.80 leaves almost no
      # room and drops attempts that land just under it.
      #
      # 0.70 was too generous, measured 2026-08-19: two wakes into an empty room at sliding
      # average 0.73 and 0.74 (the gateway logged ten seconds of silence and closed both turns),
      # and 41 of 64 detections in the device log sat below the manifest's 0.80 — the band this
      # cutoff opened is where the false accepts live. 0.78 drops both of those and still keeps
      # the quietest genuine wake measured that day (0.79).
      probability_cutoff: 0.78
    - model: https://fph-firmware-assets.s3.us-east-1.amazonaws.com/wake-word/stop.json
      id: stop
      internal: true
  vad:
  microphone:
    microphone: sat1_mics
    channels: 1
    gain_factor: 6
  stop_after_detection: false
  on_wake_word_detected:
    # If the wake word is detected when the device is muted (Possible with the software mute switch): Do nothing
    - if:
        condition:
          switch.is_off: master_mute_switch
        then:
          # If a timer is ringing: Stop it, do not start a listening session (the "stop" model lands here too)
          - if:
              condition:
                switch.is_on: timer_ringing
              then:
                - switch.turn_off: timer_ringing
              # Stop the current Kineto listening session if one is running
              else:
                - if:
                    condition:
                      lambda: return id(kv).is_listening();
                    then:
                      - kineto_voice.stop:
                    # Shut up whatever the device is saying — a downloaded announcement or a
                    # reply streamed straight into the announcement speaker. The streamed one has
                    # to be named separately: it bypasses the media_player, so is_announcing says
                    # nothing about it, and letting the wake chime start over a live stream would
                    # put two writers on the same speaker.
                    else:
                      - if:
                          condition:
                            or:
                              - media_player.is_announcing:
                                  id: external_media_player
                              - lambda: return id(kv).is_speaking();
                          then:
                            - media_player.stop:
                                announcement: true
                                id: external_media_player
                            - lambda: id(kv).abort_reply();
                          # Start a Kineto listening session and play the wake sound, if enabled
                          else:
                            # "Stop" is a wake word model like any other, so it arrives here too —
                            # and without this guard, saying it alone would open a conversation.
                            # It exists to silence the device, never to start one, and everything
                            # it is allowed to silence was already handled above: a ringing timer,
                            # a listening session, an announcement, a streamed reply. With nothing
                            # to stop, the right response is to do nothing.
                            - if:
                                condition:
                                  lambda: return wake_word != "Stop";
                                then:
                                  - if:
                                      condition:
                                        switch.is_on: wake_sound
                                      then:
                                        - script.execute:
                                            id: play_sound
                                            priority: true
                                            sound_file: "wake_word_triggered_sound"
                                        - delay: 300ms
                                  - kineto_voice.start:
                                      wake_word: !lambda return wake_word;

kineto_voice:
  id: kv
  microphone: sat1_mics
  media_player: external_media_player
  # A spoken reply can also arrive as raw PCM over the gateway socket and go straight in here,
  # playing while the rest is still being synthesized instead of after a whole file is fetched.
  announcement_speaker: announcement_resampling_speaker
  url: ${kineto_ws_url}
  device_id: ${kineto_device_id}
  auth_token: !secret kineto_auth_token

  on_connected:
    - lambda: id(init_in_progress) = false;
    - micro_wake_word.start:
    # Power up the internal amplifier so voice announcements (TTS replies) are audible.
    # The boot-time activation is conditional (line-out only), so without this the i2s
    # speaker streams into a sleeping TAS2780 and replies play silently.
    - script.execute: activate_internal_speaker
    - lambda: id(voice_assistant_phase) = ${voice_assist_idle_phase_id};
    - script.execute: control_leds

  on_disconnected:
    - lambda: id(voice_assistant_phase) = ${voice_assist_not_ready_phase_id};
    - script.execute: control_leds

  # Duck media while a listening session is running (as voice_assistant did on_start).
  on_listening_start:
    - mixer_speaker.apply_ducking:
        id: media_mixing_input
        decibel_reduction: 20
        duration: 0.0s
    - lambda: id(voice_assistant_phase) = ${voice_assist_waiting_for_command_phase_id};
    - script.execute: control_leds

  on_listening_stop:
    - mixer_speaker.apply_ducking:
        id: media_mixing_input
        decibel_reduction: 0
        duration: 1.0s
    - lambda: id(voice_assistant_phase) = ${voice_assist_idle_phase_id};
    - script.execute: control_leds

  # A streamed reply bypasses the media_player, so the preparation its announcement pipeline does
  # (media_player_no_ha.yaml, on_announcement) has to happen here instead: wake the amplifier —
  # a sleeping TAS2780 turns the reply into silence — and duck whatever music is playing. This
  # fires while the prebuffer fills, so it is done before the first sample is audible.
  on_stream_start:
    - dac_proxy.activate_speaker:
    - script.execute: tas2780_ensure_active
    - mixer_speaker.apply_ducking:
        id: media_mixing_input
        decibel_reduction: 20
        duration: 0.0s

  on_stream_stop:
    - mixer_speaker.apply_ducking:
        id: media_mixing_input
        decibel_reduction: 0
        duration: 1.0s

  # A turn the user started reached nobody: no link at wake time, or the gateway never answered
  # the wake frame. Without this the device just goes quiet, which is indistinguishable from "did
  # not hear you" — so say so out loud and show the not-ready ring. The user has to ask again.
  #
  # Deliberately NOT fired when the link dies after the gateway has answered: the words were heard,
  # the question is on its way to the chat with or without this socket, and the answer is queued
  # server-side and spoken once the client reconnects a few seconds later. There the honest
  # behaviour is silence, not a phrase about being unreachable.
  on_turn_failed:
    # This fires while the wake-word chime is still playing. Stopping that announcement and
    # starting ours in the same tick loses ours — the player is still tearing the first one down,
    # so the second call is dropped and the device just goes quiet. Let the chime finish first.
    - wait_until:
        condition:
          not:
            media_player.is_announcing:
              id: external_media_player
        timeout: 3s
    - script.execute:
        id: play_sound
        priority: true
        sound_file: "kineto_unreachable_sound"
    - lambda: id(voice_assistant_phase) = ${voice_assist_not_ready_phase_id};
    - script.execute: control_leds

  # The backend can request an LED state ({"type": "led", "state": "..."}).
  # TODO(T4): map the state strings onto the voice_assistant_leds effects.
  on_set_led:
    - logger.log:
        format: "Kineto backend requested LED state: %s"
        args: ['state.c_str()']

# The stock "Wake word sensitivity" select went with those two models: every cutoff it offered was
# calibrated for them against an English benchmark, and it could not touch ours. Our threshold is
# tuned by hand above, against false accepts measured in this actual room.
